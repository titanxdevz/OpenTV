name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build + unit test + lint
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle + Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Verify Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile release sources (warnings as errors)
        run: ./gradlew :app:compileReleaseJavaWithJavac --warning-mode all --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        if: ${{ hashFiles('app/src/test/**') != '' }}

      - name: Run unit tests (report upload)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('app/src/test/**') != ''
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload Lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Assemble debug + release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: opentv-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Secret scanning
  # ─────────────────────────────────────────────────────────────────────────
  secrets:
    name: Secret Scan · Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Dependency vulnerability scan (OWASP)
  # ─────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan · OWASP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@v4
        with:
          project: app/build.gradle
          format: HTML,SARIF
          output-file: app/build/reports/dependency-check-report
          fail-on-severity: HIGH
          suppression-file: .github/dependency-check-suppressions.xml

      - name: Upload dependency-check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: app/build/reports/dependency-check-report.*
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Container / filesystem vulnerability scan (Trivy)
  # ─────────────────────────────────────────────────────────────────────────
  trivy:
    name: Filesystem Scan · Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan filesystem for misconfigurations & secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          scanners: vuln,misconfig,secret
          exit-code: '1'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Dependency review on pull requests
  # ─────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review · Licenses & CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0

  # ─────────────────────────────────────────────────────────────────────────
  # 6. Manifest / permission policy check
  # ─────────────────────────────────────────────────────────────────────────
  manifest-policy:
    name: Manifest Policy · Permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify no dangerous permissions were added
        run: |
          set -euo pipefail
          MANIFEST="app/src/main/AndroidManifest.xml"

          echo "::group::Declared permissions"
          grep -oE 'android\.permission\.[A-Z_]+' "$MANIFEST" | sort -u | tee /tmp/perms.txt

          ALLOWED="android.permission.ACCESS_NETWORK_STATE android.permission.ACCESS_WIFI_STATE"

          FAIL=0
          while read -r perm; do
            [ -z "$perm" ] && continue
            if ! echo "$ALLOWED" | grep -qF "$perm"; then
              echo "::error::Disallowed permission declared: $perm"
              FAIL=1
            fi
          done < /tmp/perms.txt

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Manifest permission policy violated"
            exit 1
          fi
          echo "::notice::Manifest permission policy passed"

      - name: Verify no cleartext traffic or debug leftovers
        run: |
          set -euo pipefail
          if grep -rn 'android:usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml; then
            echo "::error::Cleartext traffic is enabled"
            exit 1
          fi
          if grep -rn 'android:debuggable="true"' app/src/main/AndroidManifest.xml; then
            echo "::error::android:debuggable is set in the main manifest"
            exit 1
          fi
          echo "::notice::Manifest hardening checks passed"

  # ─────────────────────────────────────────────────────────────────────────
  # 7. License allow-list check
  # ─────────────────────────────────────────────────────────────────────────
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate dependency license report
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath \
            --console=plain > dependency-tree.txt 2>&1 || true
          wc -l dependency-tree.txt

      - name: Upload dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: dependency-tree.txt
          retention-days: 14
