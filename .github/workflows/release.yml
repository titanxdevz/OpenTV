name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build · Sign · Publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      # ── Signing ──────────────────────────────────────────────────────────
      # The keystore is stored as a base64 secret so it never touches the repo.
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: |
          set -euo pipefail
          if [ -f release.jks ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            echo "::warning::No signing keystore configured — building an unsigned release APK"
            ./gradlew :app:assembleRelease --stacktrace
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -la dist/

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenTV ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            ## OpenTV ${{ github.event.inputs.tag || github.ref_name }}

            A clean, Apple TV 4K–style home screen for Android TV.

            ### Install
            ```bash
            adb install -r OpenTV-*.apk
            ```

            Verify the download:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            See the [README](https://github.com/titanxdevz/OpenTV#readme) for full setup instructions.
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
